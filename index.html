<style>
:root{--bg:#FBF8F3;--surface:#fff;--line:#E6DFD2;--ink:#15224A;--muted:#7C859E;--bad:#C4473F;--mint:#3DBE8B}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#0B1326;--surface:#121D38;--line:#223260;--ink:#EAF0FA;--muted:#8190AF;--bad:#F2837A}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 20px}
main{width:100%;max-width:360px;text-align:center}
img{width:96px;height:96px;border-radius:24px;display:block;margin:0 auto 14px}
h1{font:800 34px/1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
p{margin:0 0 22px;color:var(--muted);font-size:15px}
input[type=password]{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:17px system-ui,sans-serif;padding:0 16px;outline:none}
input[type=password]:focus{border-color:var(--mint)}
label{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 18px;font-size:14.5px;color:var(--muted)}
button{width:100%;height:52px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font:700 17px system-ui,sans-serif;cursor:pointer}
button[disabled]{opacity:.5}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:12px}
</style>
</head>

    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<script>
(function(){
  var el=document.getElementById('payload');
  var b64=function(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
  var salt=b64(el.dataset.salt), iv=b64(el.dataset.iv), iter=+el.dataset.iter, data=b64(el.textContent.trim());
  var KEY='kitty.key.'+el.dataset.salt;
  function open(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data).then(function(buf){
      var html=new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
  }
  function fromRaw(raw){ return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['decrypt']); }
  function show(){ document.getElementById('gate').hidden=false; document.getElementById('pw').focus(); }
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved){ fromRaw(b64(saved)).then(open).catch(function(){ try{localStorage.removeItem(KEY);}catch(e){} show(); }); }
  else show();
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var btn=document.getElementById('go'), err=document.getElementById('err');
    btn.disabled=true; btn.textContent='Unlocking…'; err.textContent='';
    crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey'])
      .then(function(base){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']); })
      .then(function(key){
        return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data).then(function(){
          if(document.getElementById('rem').checked){
            return crypto.subtle.exportKey('raw',key).then(function(raw){ var s='',u=new Uint8Array(raw); for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); try{ localStorage.setItem(KEY,btoa(s)); }catch(e){} return key; });
          }
          return key;
        });
      })
      .then(open)
      .catch(function(){ err.textContent='That passphrase didn’t work. Check it and try again.'; btn.disabled=false; btn.textContent='Unlock'; });
  });
})();
</script>
